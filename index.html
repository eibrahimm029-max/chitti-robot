<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Gemini Chitti Robot - Live</title>
    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            justify-content: space-between;
        }

        #robot-face-box {
            width: 100%;
            max-width: 350px;
            height: 190px;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
            margin-top: 15px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        .eye-container {
            display: flex;
            justify-content: space-around;
            width: 80px;
            margin-bottom: 12px;
        }
        .eye {
            width: 16px;
            height: 26px;
            background: #00ffcc;
            border-radius: 10px;
            animation: blink 4s infinite;
        }
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        #robot-status {
            font-size: 13px;
            color: #00ffcc;
            line-height: 1.4;
            max-height: 70px;
            overflow: hidden;
        }

        .main-panel {
            width: 100%;
            max-width: 350px;
            background: #0d1117;
            border: 1px solid #1f293d;
            padding: 12px;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 12px;
            color: #8b949e;
        }

        #floating-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ffcc;
            color: #000;
            padding: 10px 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="robot-face-box">
        <div class="eye-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <h3 id="ai-name" style="margin: 0 0 5px 0; color: #fff;">চিঠি রোবট</h3>
        <p id="robot-status">কান সজাগ রয়েছে। বলুন ওনার...</p>
    </div>

    <div class="main-panel">
        <p><strong>রোবট মোড:</strong> <span style="color: #00ffcc;">অনুমতি সাপেক্ষে লাইভ আপডেট 🛡️</span></p>
        <p><strong>অনুমোদিত কোড ও রুলস লিস্ট:</strong></p>
        <div id="rules-list" style="color: #00ffcc; max-height: 75px; overflow-y: auto;">কোনো রুলস বা কোড সেভ হয়নি।</div>
    </div>

    <div id="floating-status">🎙️ এআই মোড সক্রিয়</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
          apiKey: "AIzaSyDu3WADHPHQSHPJd1zoa5Z4TGVEP0cl_8g",
          authDomain: "chitti-bfa21.firebaseapp.com",
          databaseURL: "https://chitti-bfa21-default-rtdb.firebaseio.com",
          projectId: "chitti-bfa21",
          storageBucket: "chitti-bfa21.firebasestorage.app",
          messagingSenderId: "192136261108",
          appId: "1:192136261108:web:bf2290d269fa7a3391dda1",
          measurementId: "G-D6JM85X76F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // জেমিনি API Key
        const GEMINI_API_KEY = "AQ.Ab8RN6IEF-dUdQd8i1GSGKK7VEjBLl3FixNZI-951isnS7IlMA";

        let robotMemory = {
            name: "চিঠি রোবট",
            rules: []
        };

        let recognition = null;
        let pendingAction = null; // ইউজারের অনুমতির জন্য পেন্ডিং রাখা ডাটা

        window.onload = function() {
            loadFirebaseMemory();
            startContinuousListening();
            speakAndDisplay("হ্যালো ওনার! আমি চিঠি রোবট। বলুন, আজ কী নিয়ে আলোচনা বা কোডিং করব?");
        };

        function loadFirebaseMemory() {
            const dbRef = ref(db, 'chitti_ai_core/');
            onValue(dbRef, (snapshot) => {
                let data = snapshot.val();
                if (data) {
                    if (data.name) {
                        robotMemory.name = data.name;
                        document.getElementById('ai-name').innerText = data.name;
                    }
                    if (data.rules) {
                        robotMemory.rules = data.rules;
                        updateRulesUI();
                    }
                }
            });
        }

        function startContinuousListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                let spokenText = event.results[event.results.length - 1][0].transcript.trim();
                if (spokenText.length > 1) {
                    processWithGeminiAI(spokenText);
                }
            };

            recognition.onerror = function() { 
                setTimeout(() => { try { recognition.start(); } catch(e) {} }, 200); 
            };
            
            recognition.onend = function() { 
                setTimeout(() => { try { recognition.start(); } catch(e) {} }, 200); 
            };

            try { recognition.start(); } catch(e) {}
        }

        async function processWithGeminiAI(userInput) {
            speakAndDisplay("ভাবছি...");

            try {
                let prompt = `তুমি একজন বুদ্ধিমান অটোনমাস এআই রোবট যার নাম "${robotMemory.name}"। ইউজারের বর্তমান কমান্ড বা কথা হলো: "${userInput}".
                
                তোমাকে নিয়ম মেনে চলতে হবে:
                1. তুমি ইউজারের সাথে কথা বলবে, যুক্তি পরামর্শ করবে।
                2. যদি ইউজার কোনো কোড, নাম পরিবর্তন বা ডাটাবেস আপডেট করার বড় অনুরোধ করে, তবে সাথে সাথে সেভ কোরো না। প্রথমে জাস্ট আলাপ করো এবং আউটপুটে 'needsPermission' কে true করে একটি প্রপোজাল বা প্রশ্ন তৈরি করো।
                3. যদি ইউজার এর আগের কোনো প্রস্তাবে সম্মতি বা অনুমতি দেয় (যেমন: "হ্যাঁ ঠিক আছে", "করো", "ঠিক আছে সেভ করো"), তবে 'isConfirmed' কে true করো।
                4. আমাকে নিচের কঠোর JSON ফরম্যাটে উত্তর দেবে:
                {
                  "intent": "chat / request_update / confirm_permission",
                  "extractedData": "যে কোড বা ডেটা নিয়ে কথা হচ্ছে বা আপডেট হবে",
                  "replyMessage": "রোবটের মুখে বলার মতো চমৎকার সাবলীল বাংলা উত্তর",
                  "needsPermission": true/false
                }`;

                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                let result = await response.json();
                let textResponse = result.candidates[0].content.parts[0].text;
                
                let jsonClean = textResponse.substring(textResponse.indexOf('{'), textResponse.lastIndexOf('}') + 1);
                let aiData = JSON.parse(jsonClean);

                handleAiLogic(aiData, userInput);

            } catch (error) {
                speakAndDisplay("আপনার কথা বুঝতে পেরেছি ওনার। বলুন, এ বিষয়ে আর কী করতে হবে?");
            }
        }

        function handleAiLogic(data, rawInput) {
            let reply = data.replyMessage || "বুঝেছি ওনার।";

            // যদি ইউজার অনুমতি দেয় (যেমন হ্যাঁ, করো ইত্যাদি বলে)
            let isUserApproving = rawInput.includes("হ্যাঁ") || rawInput.includes("করো") || rawInput.includes("ঠিক আছে") || rawInput.includes("দাও");

            if (pendingAction && isUserApproving) {
                // অনুমতি পাওয়া গেছে, এখন ফায়ারবেসে লাইভ আপডেট হবে!
                executeDatabaseUpdate(pendingAction);
                pendingAction = null;
                return;
            }

            if (data.needsPermission && data.extractedData) {
                // অনুমতি নেওয়ার জন্য আটকে রাখা হলো, আগে রোবট পরামর্শ বা প্রশ্ন করবে
                pendingAction = data;
                speakAndDisplay(reply + " এটি কি ফায়ারবেসে লাইভ করে দেব, ওনার?");
            } else {
                // সাধারণ কথা বা আলোচনা
                speakAndDisplay(reply);
            }
        }

        function executeDatabaseUpdate(data) {
            speakAndDisplay("আপনার অনুমতি পেয়েছি। ফায়ারবেসে লাইভ আপডেট করা হচ্ছে...");
            
            // যদি নাম পরিবর্তনের রিকোয়েস্ট হয়
            if (data.extractedData && data.extractedData.length < 20 && !data.extractedData.includes("code")) {
                robotMemory.name = data.extractedData;
                set(ref(db, 'chitti_ai_core/name'), robotMemory.name);
                document.getElementById('ai-name').innerText = robotMemory.name;
            } else {
                // নতুন রুলস বা কোড লজিক যোগ করা
                robotMemory.rules.push(data.extractedData);
                set(ref(db, 'chitti_ai_core/rules'), robotMemory.rules);
                updateRulesUI();
            }

            setTimeout(() => {
                speakAndDisplay("সবকিছু সফলভাবে ফায়ারবেসে লাইভ ও সেভ করে দিয়েছি ওনার!");
            }, 1500);
        }

        function updateRulesUI() {
            let container = document.getElementById('rules-list');
            if (robotMemory.rules.length > 0) {
                container.innerHTML = robotMemory.rules.map((rule, idx) => `<div>${idx + 1}. ${rule}</div>`).join('');
            } else {
                container.innerHTML = "কোনো রুলস বা কোড সেভ হয়নি।";
            }
        }

        function speakAndDisplay(text) {
            document.getElementById('robot-status').innerText = text;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
