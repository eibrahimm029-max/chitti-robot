<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চিঠি রোবট</title>
    <style>
        body { background: #050505; color: #00ffcc; font-family: monospace; text-align: center; padding: 20px; }
        .box { border: 2px solid #00ffcc; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 0 15px #00ffcc; }
        input { background: #000; border: 1px solid #00ffcc; color: #00ffcc; padding: 10px; width: 60%; border-radius: 5px; outline: none; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        #reply { margin-top: 20px; min-height: 50px; font-size: 16px; word-wrap: break-word; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🤖 চিঠি রোবট</h2>
        <div id="reply">সার্ভার প্রস্তুত! কিছু লিখুন...</div>
        <br>
        <input type="text" id="userInput" placeholder="বার্তা লিখুন...">
        <button onclick="send()">পাঠান</button>
    </div>

    <script>
        const SERVER_URL = "https://chitti-robot-qh89.onrender.com/chat";

        async function send() {
            let input = document.getElementById('userInput');
            let replyDiv = document.getElementById('reply');
            let msg = input.value.trim();
            if(!msg) return;

            replyDiv.innerText = "চিন্তা করছি...";
            input.value = "";

            try {
                let res = await fetch(SERVER_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message: msg})
                });
                let data = await res.json();
                replyDiv.innerText = data.reply;
            } catch (err) {
                replyDiv.innerText = "সার্ভারের সাথে কানেক্ট করা যাচ্ছে না!";
            }
        }
    </script>
</body>
</html>
