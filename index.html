<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">চিঠি এআই রোবট - সুপার কন্ট্রোল</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background: linear-gradient(135deg, #05050e 0%, #121225 100%); 
            color: #00ffcc; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
        }

        /* থ্রি-লাইনস মেনু বাটন */
        .menu-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 26px;
            cursor: pointer;
            color: #00ffcc;
            z-index: 10;
        }

        /* স্লাইড-আউট সাইডবার মেনু */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 100;
            top: 0;
            left: 0;
            background-color: rgba(10, 10, 20, 0.95);
            backdrop-filter: blur(10px);
            overflow-x: hidden;
            transition: 0.4s;
            padding-top: 60px;
            border-right: 2px solid #00ffcc;
            text-align: left;
        }

        .sidebar .closebtn {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 30px;
            color: #ff0055;
            cursor: pointer;
        }

        .sidebar-content {
            padding: 20px;
        }

        .sidebar h3 {
            color: #00ffcc;
            margin-bottom: 15px;
            border-bottom: 1px solid #00ffcc;
            padding-bottom: 5px;
        }

        .reg-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 6px;
        }

        .reg-btn {
            width: 100%;
            background: #00ffcc;
            color: #000;
            padding: 10px;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .box { 
            border: 2px solid rgba(0, 255, 204, 0.3); 
            padding: 20px; 
            border-radius: 20px; 
            width: 100%;
            max-width: 450px; 
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.15); 
            background: rgba(16, 16, 26, 0.85); 
            backdrop-filter: blur(10px);
        }

        h2 { font-size: 22px; margin-bottom: 10px; text-shadow: 0 0 10px #00ffcc; }

        #robotFace {
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 15px;
            margin: 10px auto;
            display: block;
            box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            margin-bottom: 10px;
        }

        #reply { 
            margin: 10px 0; 
            min-height: 55px; 
            font-size: 15px; 
            line-height: 1.5; 
            color: #ffffff; 
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 10px;
            border-left: 3px solid #00ffcc;
            text-align: left;
        }

        .sensor-container {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #00ffcc;
            margin: 10px 0;
            font-size: 14px;
        }

        .switches-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .switch-btn {
            background: #18182a;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .switch-btn:hover { background: #00ffcc; color: #000; }

        .input-group {
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px;
            margin-top: 10px;
        }

        input[type="text"] { 
            background: #000; 
            border: 1px solid #00ffcc; 
            color: #00ffcc; 
            padding: 10px; 
            flex: 1;
            border-radius: 8px; 
            outline: none; 
            font-size: 14px; 
        }

        .send-btn { 
            background: #00ffcc; 
            color: #000; 
            border: none; 
            padding: 10px 15px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
        }

        .mic-btn { 
            background: #ff0055; 
            color: white; 
            border: none;
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            cursor: pointer;
            box-shadow: 0 0 10px #ff0055;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- থ্রি-লাইনস মোটন -->
    <div class="menu-icon" onclick="openNav()">☰</div>

    <!-- সাইডবার রেজিস্ট্রেশন মেনু -->
    <div id="mySidebar" class="sidebar">
        <span class="closebtn" onclick="closeNav()">×</span>
        <div class="sidebar-content">
            <h3>👤 সদস্য নিবন্ধন</h3>
            <label>সদস্যের নাম:</label>
            <input type="text" id="regName" class="reg-input" placeholder="যেমন: আবির">
            
            <label>রোল সিলেক্ট করুন:</label>
            <select id="regRole" class="reg-input">
                <option value="Family">Family Member</option>
                <option value="Owner">Owner (Full Access)</option>
            </select>

            <button class="reg-btn" style="background:#ff0055; color:#fff;" onclick="recordVoiceSample()">🎙️ ভয়েস স্যাম্পল রেকর্ড করুন</button>
            <p id="recordStatus" style="font-size:12px; margin-top:5px; color:#aaa;">ভয়েস নেওয়া হয়নি</p>

            <button class="reg-btn" onclick="saveMember()">সংরক্ষণ করুন</button>
        </div>
    </div>

    <div class="box">
        <h2 id="appHeader">🤖 চিঠি এআই রোবট</h2>
        <div class="status-badge" id="roleBadge">ইউজার মোড: Guest</div>
        
        <canvas id="robotFace" width="280" height="120"></canvas>

        <div id="reply">আমি প্রস্তুত! আপনার নির্দেশ দিন।</div>

        <div class="sensor-container">
            <div>🌡️ তাপমাত্রা: <span id="tempVal">--</span>°C</div>
            <div>🔥 গ্যাস: <span id="gasVal">স্বাভাবিক</span></div>
        </div>

        <div class="switches-grid">
            <button class="switch-btn" onclick="toggleDevice('light')">💡 লাইট অন/অফ</button>
            <button class="switch-btn" onclick="toggleDevice('fan')">🌀 ফ্যান অন/অফ</button>
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="কমান্ড লিখুন বা ভয়েস দিন...">
            <button class="send-btn" onclick="sendMsg()">পাঠান</button>
            <button class="mic-btn" onclick="startVoice()">🎤</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://chitti-bfa21-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // সাইডবার ওপেন ও ক্লোজ
        function openNav() { document.getElementById("mySidebar").style.width = "280px"; }
        function closeNav() { document.getElementById("mySidebar").style.width = "0"; }

        // ভয়েস স্যাম্পল নেওয়া
        let recordedSampleText = "";
        function recordVoiceSample() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Google Chrome ব্যবহার করুন।"); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';
            recognition.start();

            document.getElementById('recordStatus').innerText = "রেকর্ড হচ্ছে... কিছু বলুন";

            recognition.onresult = function(event) {
                recordedSampleText = event.results[0][0].transcript;
                document.getElementById('recordStatus').innerText = "স্যাম্পল রেকর্ড সম্পন্ন!";
            };
        }

        // নতুন ফ্যামিলি মেম্বার রেজিস্টার ও ফায়ারবেসে সেভ
        function saveMember() {
            let name = document.getElementById('regName').value.trim();
            let role = document.getElementById('regRole').value;

            if(!name) { alert("নাম লিখুন!"); return; }

            let memberId = "user_" + Date.now();
            firebase.database().ref('registered_members/' + memberId).set({
                name: name,
                role: role,
                voice_sample: recordedSampleText
            }).then(() => {
                alert(name + " সফলভাবে রেজিস্টার হয়েছে!");
                closeNav();
            });
        }

        // ফায়ারবেস থেকে লাইভ সেন্সর ডাটা পড়া
        firebase.database().ref('sensors').on('value', function(snapshot) {
            const data = snapshot.val();
            if (data) {
                if (data.temperature) document.getElementById('tempVal').innerText = data.temperature;
                if (data.gas) document.getElementById('gasVal').innerText = data.gas;
            }
        });

        const SERVER_URL = "https://chitti-robot-qh89.onrender.com/chat";
        const canvas = document.getElementById('robotFace');
        const ctx = canvas.getContext('2d');
        let eyeState = 'idle';

        function drawFace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ffcc";

            if (eyeState === 'listening') {
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#00ffcc";
                ctx.beginPath();
                ctx.arc(80, 50, 22, 0, Math.PI * 2);
                ctx.arc(200, 50, 22, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.shadowBlur = 5;
                ctx.shadowColor = "#00ffcc";
                ctx.fillRect(60, 40, 40, 20);
                ctx.fillRect(180, 40, 40, 20);
            }

            ctx.beginPath();
            if (eyeState === 'speaking') {
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#ff0055";
                let randomHeight = Math.random() * 15 + 5;
                ctx.moveTo(100, 95 - randomHeight);
                ctx.lineTo(140, 95 + randomHeight);
                ctx.lineTo(180, 95 - randomHeight);
                ctx.stroke();
            } else {
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#00ffcc";
                ctx.moveTo(100, 95);
                ctx.lineTo(180, 95);
                ctx.stroke();
            }
        }
        setInterval(drawFace, 150);

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Google Chrome ব্যবহার করুন।"); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';
            eyeState = 'listening';
            recognition.start();

            document.getElementById('reply').innerText = "শুনছি, বলুন...";

            recognition.onresult = function(event) {
                let text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                sendMsg();
            };

            recognition.onend = function() { eyeState = 'idle'; };
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                eyeState = 'speaking';
                
                utterance.onend = function() { eyeState = 'idle'; };
                window.speechSynthesis.speak(utterance);
            }
        }

        async function sendMsg() {
            let input = document.getElementById('userInput');
            let replyDiv = document.getElementById('reply');
            let msg = input.value.trim();
            if(!msg) return;

            replyDiv.innerText = "প্রসেস করা হচ্ছে...";
            input.value = "";

            try {
                let res = await fetch(SERVER_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        message: msg,
                        user_id: "owner_voice_sample"
                    })
                });

                let data = await res.json();
                replyDiv.innerText = data.reply;
                if(data.user_role) {
                    document.getElementById('roleBadge').innerText = "ইউজার মোড: " + data.user_role;
                }
                speakText(data.reply);

            } catch (err) {
                replyDiv.innerText = "সার্ভারের সাথে সংযোগ বিচ্ছিন্ন হয়েছে!";
                eyeState = 'idle';
            }
        }

        function toggleDevice(device) {
            document.getElementById('userInput').value = device + " অন অফ করো";
            sendMsg();
        }
    </script>
</body>
</html>
