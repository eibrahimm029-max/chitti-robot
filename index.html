<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVS Neural Production Studio - 4K Autonomous AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .app-container { max-width: 900px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 25px; }
        .logo-area h1 { margin: 0; font-size: 22px; color: var(--accent-color); display: flex; align-items: center; gap: 10px; }
        .status-pill { background: rgba(34, 197, 94, 0.15); color: var(--success-color); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .action-btn { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .output-section { margin-top: 25px; background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .download-btn { background: #059669; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; margin-top: 15px; }
        pre { background: #1e293b; padding: 15px; border-radius: 8px; overflow-x: auto; color: #38bdf8; font-size: 13px; max-height: 250px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1><i class="fa-solid fa-brain"></i> AVS Neural Studio</h1>
            </div>
            <div class="status-pill" id="server-status">
                <i class="fa-solid fa-circle-dot"></i> Connecting...
            </div>
        </div>

        <button class="action-btn" onclick="triggerProduction()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Trigger Instant 4K AI Production & Video Render
        </button>

        <div class="output-section">
            <h3><i class="fa-solid fa-terminal"></i> Live Production & Video Package</h3>
            <pre id="output-box">Click the button above to start AI video generation...</pre>
            <a id="download-link" class="download-btn" href="#" style="display:none;" target="_blank" download>
                <i class="fa-solid fa-download"></i> Download Rendered Video (MP4)
            </a>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://chitti-robot-qh89.onrender.com";

        // Check Server Status
        fetch(BACKEND_URL + '/')
            .then(res => res.json())
            .then(data => {
                document.getElementById('server-status').innerHTML = `<i class="fa-solid fa-circle-dot"></i> ${data.status}`;
            }).catch(err => {
                document.getElementById('server-status').innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> OFFLINE`;
                document.getElementById('server-status').style.color = '#ef4444';
            });

        // Trigger Production
        function triggerProduction() {
            const outputBox = document.getElementById('output-box');
            const downloadBtn = document.getElementById('download-link');
            
            outputBox.innerText = "🚀 AI is scouting trends, compiling script, and rendering 4K video file...";
            downloadBtn.style.display = "none";

            fetch(BACKEND_URL + '/trigger-manual-production')
                .then(res => res.json())
                .then(data => {
                    outputBox.innerText = JSON.stringify(data, null, 2);
                    if (data.video_download_url) {
                        downloadBtn.style.display = "inline-flex";
                        downloadBtn.href = data.video_download_url;
                    }
                })
                .catch(err => {
                    outputBox.innerText = "❌ Error executing pipeline: " + err;
                });
        }
    </script>
</body>
</html>
