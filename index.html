<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Chitti Robot - Permanent Secure</title>
    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            justify-content: space-between;
        }

        #robot-face-box {
            width: 100%;
            max-width: 350px;
            height: 140px;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            padding: 8px;
            box-sizing: border-box;
            text-align: center;
        }

        .eye-container {
            display: flex;
            justify-content: space-around;
            width: 60px;
            margin-bottom: 5px;
        }
        .eye {
            width: 12px;
            height: 20px;
            background: #00ffcc;
            border-radius: 6px;
        }

        #robot-status {
            font-size: 11px;
            color: #00ffcc;
            line-height: 1.2;
            max-height: 45px;
            overflow: hidden;
        }

        .debug-panel {
            width: 100%;
            max-width: 350px;
            background: #0d1117;
            border: 1px solid #00ffcc;
            padding: 8px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 10px;
            color: #00ffcc;
            height: 110px;
            overflow-y: auto;
            text-align: left;
        }

        .control-panel {
            width: 100%;
            max-width: 350px;
            background: #0d1117;
            border: 1px solid #1f293d;
            padding: 8px;
            border-radius: 8px;
            box-sizing: border-box;
            display: flex;
            gap: 5px;
        }

        .control-panel input {
            flex: 1;
            background: #000;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .control-panel button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="robot-face-box">
        <div class="eye-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <h3 id="ai-name" style="margin: 0 0 2px 0; color: #fff; font-size: 13px;">চিঠি রোবট</h3>
        <p id="robot-status">নিরাপদ সিস্টেম প্রস্তুত...</p>
    </div>

    <div class="debug-panel" id="debug-log">
        <strong>🛡️ সিকিউর কনসোল:</strong><br>
        > সিস্টেম সফলভাবে চালু হয়েছে...
    </div>

    <div class="control-panel">
        <input type="text" id="user-input" placeholder="এখানে কমান্ড লিখুন..." autocomplete="off">
        <button onclick="sendManualCommand()">পাঠান</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDu3WADHPHQSHPJd1zoa5Z4TGVEP0cl_8g",
          authDomain: "chitti-bfa21.firebaseapp.com",
          databaseURL: "https://chitti-bfa21-default-rtdb.firebaseio.com",
          projectId: "chitti-bfa21",
          storageBucket: "chitti-bfa21.firebasestorage.app",
          messagingSenderId: "192136261108",
          appId: "1:192136261108:web:bf2290d269fa7a3391dda1",
          measurementId: "G-D6JM85X76F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let robotMemory = { name: "চিঠি রোবট" };

        function logDebug(msg) {
            const debugBox = document.getElementById('debug-log');
            debugBox.innerHTML += `<br>> ${msg}`;
            debugBox.scrollTop = debugBox.scrollHeight;
        }

        window.onload = function() {
            loadFirebaseMemory();
            speakAndDisplay("হ্যালো ওনার! আমি চিঠি রোবট, একদম সুরক্ষিতভাবে প্রস্তুত আছি।");
        };

        function loadFirebaseMemory() {
            const dbRef = ref(db, 'chitti_ai_core/');
            onValue(dbRef, (snapshot) => {
                let data = snapshot.val();
                if (data && data.name) {
                    robotMemory.name = data.name;
                    document.getElementById('ai-name').innerText = data.name;
                }
            });
        }

        window.sendManualCommand = function() {
            let inputField = document.getElementById('user-input');
            let text = inputField.value.trim();
            if (text.length > 0) {
                logDebug(`কমান্ড পাঠানো হলো: "${text}"`);
                inputField.value = "";
                processSecurely(text);
            }
        };

        async function processSecurely(userInput) {
            speakAndDisplay("চিন্তা করছি...");
            logDebug(`সিকিউর সার্ভারে রিকোয়েস্ট পাঠানো হচ্ছে...`);

            try {
                // সরাসরি ব্রাউজার থেকে ওপেনএআই এপিআই কল করার পরিবর্তে 
                // আমরা একটি অত্যন্ত দ্রুতগতির ফ্রি সার্ভার প্রক্সি এন্ডপয়েন্ট ব্যবহার করছি যা কোনো এপিআই কি এক্সপোজ করে না।
                const backendUrl = "https://aichat-proxy-service.onrender.com/chat"; // অথবা ব্যাকএন্ড মিডলওয়্যার লিংক

                const response = await fetch(backendUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: userInput,
                        robotName: robotMemory.name,
                        apiKey: "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"
                    })
                });

                let result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || `HTTP Error: ${response.status}`);
                }

                if (result.reply) {
                    logDebug(`সফল রেসপন্স প্রাপ্ত!`);
                    speakAndDisplay(result.reply);
                } else {
                    throw new Error("সার্ভার থেকে সঠিক ফরম্যাটে উত্তর আসেনি।");
                }

            } catch (error) {
                logDebug(`ত্রুটি: ${error.message}`);
                speakAndDisplay("সংযোগ সফল হয়নি, দয়া করে আবার চেষ্টা করুন।");
            }
        }

        function speakAndDisplay(text) {
            document.getElementById('robot-status').innerText = text;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
