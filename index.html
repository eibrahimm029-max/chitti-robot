<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chitti AI Core Robot</title>
    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        #robot-face-box {
            width: 100%;
            max-width: 350px;
            height: 120px;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            margin-bottom: 20px;
            text-align: center;
        }

        #robot-status {
            font-size: 12px;
            color: #00ffcc;
            padding: 0 10px;
        }

        .debug-panel {
            width: 100%;
            max-width: 350px;
            background: #0d1117;
            border: 1px solid #00ffcc;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            height: 150px;
            overflow-y: auto;
            text-align: left;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .control-panel {
            width: 100%;
            max-width: 350px;
            display: flex;
            gap: 8px;
        }

        .control-panel input {
            flex: 1;
            background: #000;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        .control-panel button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="robot-face-box">
        <h3 id="ai-name" style="margin: 0 0 5px 0;">চিঠি রোবট</h3>
        <p id="robot-status">সিস্টেম প্রস্তুত হচ্ছে...</p>
    </div>

    <div class="debug-panel" id="debug-log">
        <strong>🤖 রোবট অটোমেশন সিস্টেম:</strong>
    </div>

    <div class="control-panel">
        <input type="text" id="user-input" placeholder="কমান্ড লিখুন..." autocomplete="off">
        <button id="send-btn">পাঠান</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
          databaseURL: "https://chitti-bfa21-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let robotName = "চিঠি রোবট";
        let activeApiKey = "";

        function logDebug(msg) {
            const debugBox = document.getElementById('debug-log');
            debugBox.innerHTML += `<br>> ${msg}`;
            debugBox.scrollTop = debugBox.scrollHeight;
        }

        // ফায়ারবেস থেকে ডাটা সিঙ্ক করা
        onValue(ref(db, 'chitti_ai_core'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.name) {
                    robotName = data.name;
                    document.getElementById('ai-name').innerText = robotName;
                }
                if (data.gemini_key) {
                    activeApiKey = data.gemini_key.trim();
                    logDebug("ফায়ারবেস থেকে নতুন এপিআই কি সিঙ্ক হয়েছে।");
                    speakAndDisplay(`আমি ${robotName}, অনলাইন হয়েছি!`);
                }
            }
        });

        document.getElementById('send-btn').addEventListener('click', processCommand);
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processCommand();
        });

        async function processCommand() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();

            if (!text) return;
            if (!activeApiKey) {
                logDebug("ত্রুটি: ফায়ারবেসে এপিআই কি পাওয়া যায়নি।");
                speakAndDisplay("এপিআই কি সেট করা হয়নি।");
                return;
            }

            logDebug(`ইনপুট: "${text}"`);
            inputField.value = "";
            speakAndDisplay("ভাবছি...");

            // Gemini API Call Process
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${activeApiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `তুমি একটি অটোনমাস রোবট। তোমার নাম "${robotName}"। উত্তর সংক্ষেপে বাংলায় দাও। প্রশ্ন: ${text}` }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    logDebug("রেসপন্স সফল!");
                    speakAndDisplay(aiReply);
                } else {
                    throw new Error("Invalid API Response");
                }
            } catch (error) {
                logDebug(`এরর: ${error.message}`);
                speakAndDisplay("কানেকশনে সমস্যা হয়েছে, আবার চেষ্টা করুন।");
            }
        }

        function speakAndDisplay(text) {
            document.getElementById('robot-status').innerText = text;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
