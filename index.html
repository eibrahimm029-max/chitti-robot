<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Production Studio</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #131a2a;
      --panel-2: #192236;
      --border: #26334d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1060px; margin: 0 auto; padding: 24px 16px 60px; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 22px;
    }
    h1 { margin: 0; font-size: 1.35rem; }
    .sub { color: var(--muted); font-size: 0.88rem; }
    .header-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .stage-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px;
      background: var(--panel-2); border: 1px solid var(--border);
      font-size: 0.82rem; color: var(--accent);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--success); }
    .dot.err { background: var(--danger); }
    .dot.busy { background: var(--accent); }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; margin-bottom: 18px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button {
      cursor: pointer; border: none; border-radius: 10px; padding: 10px 16px;
      font-weight: 600; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    button:disabled { opacity: 0.65; cursor: not-allowed; }
    button.secondary { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
    pre {
      background: var(--panel-2); padding: 12px; border-radius: 10px;
      white-space: pre-wrap; font-size: 0.88rem; overflow-x: auto;
    }
    .scene { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 10px; }
    .err { color: #fecaca; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); padding: 12px; border-radius: 10px; display: none; margin-bottom: 14px; }
    #result { display: none; }
    #monitor-panel { display: none; margin-bottom: 18px; }
    .mod-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
    .mod-item { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 0.84rem; }
    .mod-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 4px; }
    .tag-on { color: var(--success); font-size: 0.78rem; }
    .tag-off { color: var(--muted); font-size: 0.78rem; }
    .ev-list { margin-top: 10px; max-height: 220px; overflow-y: auto; }
    .ev-row { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>AI Video Production Studio</h1>
        <div class="sub">Gemini Script · Pixabay &amp; NASA Vault · Refined Male/Female TTS · MoviePy (1s–10s)</div>
      </div>
      <div class="header-right">
        <div class="stage-pill"><span class="dot" id="stage-dot"></span><span id="live-stage-badge">প্রস্তুত (IDLE)</span></div>
        <div class="badge"><span class="dot" id="dot"></span><span id="status">চেক হচ্ছে...</span></div>
        <button type="button" class="secondary" id="monitor-toggle-btn">Live Brain Monitor</button>
      </div>
    </header>

    <div class="err" id="err"></div>

    <div class="card" id="monitor-panel">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <strong>Real-Time Connection, Download &amp; Signal Flow</strong>
        <span class="sub" id="monitor-sync-meta">সিঙ্ক হচ্ছে...</span>
      </div>
      <div class="mod-grid" id="monitor-modules"></div>
      <div style="margin-top:12px;">
        <label>Live API Connections, Downloads &amp; Signals</label>
        <div class="ev-list" id="monitor-events"></div>
      </div>
    </div>

    <form class="card" id="form">
      <div class="grid">
        <div>
          <label for="niche">Niche</label>
          <select id="niche">
            <option value="Tech & AI">Tech &amp; AI</option>
            <option value="Mystery & Thriller">Mystery &amp; Thriller</option>
            <option value="Motivation & Story">Motivation &amp; Story</option>
            <option value="Science & Space">Science &amp; Space</option>
          </select>
        </div>
        <div>
          <label for="topic">Topic</label>
          <input id="topic" type="text" placeholder="যেমন: এআই কীভাবে কাজ করে?" required />
        </div>
        <div>
          <label for="language">Voice &amp; Language</label>
          <select id="language">
            <option value="Bengali Female" selected>বাংলা · মেয়েদের কণ্ঠ (Female)</option>
            <option value="Bengali Male">বাংলা · ছেলেদের কণ্ঠ (Male)</option>
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
          </select>
        </div>
        <div>
          <label for="format_type">Video Size &amp; Format</label>
          <select id="format_type">
            <option value="Short Video (9:16)" selected>Short Video (9:16 · Reels/Shorts)</option>
            <option value="Long Video (16:9)">Long Video (16:9 · YouTube)</option>
          </select>
        </div>
        <div>
          <label for="clip_seconds">Clip Duration (1s–10s)</label>
          <select id="clip_seconds">
            <option value="1">1 second</option>
            <option value="2">2 seconds</option>
            <option value="3">3 seconds</option>
            <option value="4">4 seconds</option>
            <option value="5" selected>5 seconds</option>
            <option value="10">10 seconds</option>
          </select>
        </div>
        <div>
          <label for="visual_style">Visual Style</label>
          <select id="visual_style">
            <option value="Cinematic Dark AI">Cinematic Dark AI</option>
            <option value="3D Animation">3D Animation</option>
            <option value="Documentary Realistic">Documentary Realistic</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button type="submit" id="gen-btn">Generate Script &amp; Plan</button>
        <button type="button" class="secondary" id="tts-btn">Generate Refined Voice (TTS)</button>
        <button type="button" class="secondary" id="clip-btn">Build Selected Clip</button>
        <button type="button" class="secondary" id="step-clip-btn">1s–10s Step Sequence</button>
      </div>
    </form>

    <div class="card" id="media-card" style="display:none;">
      <label>Audio / Clip Output &amp; Live Activity</label>
      <div id="media-out"></div>
    </div>

    <div id="result">
      <div class="card">
        <h2 id="title" style="margin-top:0;"></h2>
        <p id="hook" style="color:var(--accent);"></p>
        <label>Voiceover Script</label>
        <pre id="script"></pre>
        <div class="actions">
          <button type="button" class="secondary" id="copy-btn">Script Copy</button>
          <button type="button" class="secondary" id="dl-btn">JSON Download</button>
        </div>
      </div>
      <div class="card">
        <label>Thumbnail Prompt</label>
        <pre id="thumb"></pre>
      </div>
      <div class="card">
        <label>Scenes</label>
        <div id="scenes"></div>
      </div>
      <div class="card">
        <label>Connected APIs, Downloads &amp; Vault Status</label>
        <pre id="api-info"></pre>
      </div>
    </div>
  </div>

  <script>
    let currentPlan = null;
    let monitorInterval = null;
    let monitorOpen = false;

    function showErr(msg) {
      const el = document.getElementById("err");
      el.textContent = msg;
      el.style.display = "block";
    }
    function clearErr() {
      const el = document.getElementById("err");
      el.textContent = "";
      el.style.display = "none";
    }

    function setStageUi(labelBn, isBusy = false) {
      const badge = document.getElementById("live-stage-badge");
      const sDot = document.getElementById("stage-dot");
      if (badge) badge.textContent = labelBn || "প্রস্তুত (IDLE)";
      if (sDot) sDot.className = isBusy ? "dot busy" : "dot ok";
    }

    async function parseJsonSafe(res) {
      const rawText = await res.text();
      const ct = (res.headers.get("content-type") || "").toLowerCase();
      if (!ct.includes("application/json") && rawText.trim().startsWith("<")) {
        throw new Error("সার্ভার থেকে JSON-এর বদলে HTML পেজ এসেছে (সম্ভবত সার্ভার রিস্টার্ট বা টাইমআউট হয়েছে)।");
      }
      try {
        return JSON.parse(rawText);
      } catch {
        throw new Error("সার্ভারের রেসপন্স পড়া যায়নি; অনুগ্রহ করে আবার চেষ্টা করুন।");
      }
    }

    function renderLiveFeedIntoMedia(events) {
      if (!Array.isArray(events) || !events.length) return "";
      const top = events.slice(0, 4).map(
        (ev) => `<div class="ev-row"><strong>[${ev.status}] ${ev.from} → ${ev.to}:</strong> ${ev.detail}</div>`
      ).join("");
      return `<div class="ev-list">${top}</div>`;
    }

    async function fetchBrainMonitor() {
      try {
        const res = await fetch("/api/brain-monitor", { cache: "no-store" });
        const data = await parseJsonSafe(res);
        const tel = data.telemetry || {};
        const isBusy = tel.sync_state === "PROCESSING";
        setStageUi(tel.stage_label_bn || (isBusy ? "কাজ চলছে..." : "প্রস্তুত (IDLE)"), isBusy);

        if (monitorOpen) {
          const metaEl = document.getElementById("monitor-sync-meta");
          if (metaEl) {
            metaEl.textContent = `State: ${tel.sync_state || "IDLE"} · Requests: ${tel.total_requests || 0} · Fallbacks: ${tel.fallback_events || 0}`;
          }
          const modWrap = document.getElementById("monitor-modules");
          if (modWrap && Array.isArray(data.modules)) {
            modWrap.innerHTML = data.modules.map((m) => `
              <div class="mod-item">
                <div class="mod-head">
                  <span>${m.name}</span>
                  <span class="${m.online ? "tag-on" : "tag-off"}">${m.online ? "ONLINE" : "STANDBY"}</span>
                </div>
                <div class="sub">${m.capability || ""}</div>
                <div class="sub" style="margin-top:4px;">→ ${(m.connects_to || []).join(", ")}</div>
              </div>
            `).join("");
          }
          const evWrap = document.getElementById("monitor-events");
          if (evWrap && Array.isArray(tel.recent_events)) {
            evWrap.innerHTML = tel.recent_events.slice(0, 10).map((ev) => `
              <div class="ev-row">
                <strong>[${ev.status}] ${ev.from} → ${ev.to}:</strong> ${ev.detail}
              </div>
            `).join("") || `<div class="sub">এখনো কোনো সাম্প্রতিক সংযোগ বা ডাউনলোড সিগন্যাল নেই।</div>`;
          }
        }
        return data;
      } catch {
        return null;
      }
    }

    function startStagePolling(ms = 1600) {
      if (monitorInterval) clearInterval(monitorInterval);
      fetchBrainMonitor();
      monitorInterval = setInterval(fetchBrainMonitor, ms);
    }

    function stopStagePolling() {
      if (monitorInterval && !monitorOpen) {
        clearInterval(monitorInterval);
        monitorInterval = null;
      }
    }

    document.getElementById("monitor-toggle-btn").addEventListener("click", () => {
      monitorOpen = !monitorOpen;
      const panel = document.getElementById("monitor-panel");
      panel.style.display = monitorOpen ? "block" : "none";
      if (monitorOpen) {
        startStagePolling(2000);
      } else {
        stopStagePolling();
      }
    });

    async function checkHealth() {
      try {
        const res = await fetch("/api/health", { cache: "no-store" });
        const data = await parseJsonSafe(res);
        document.getElementById("dot").className = "dot ok";
        document.getElementById("status").textContent =
          `Online · Gemini: ${data.gemini_configured ? "OK" : "No Key"} · TTS: ${data.edge_tts_available ? "OK" : "Off"} · MoviePy: ${data.moviepy_available ? "OK" : "Off"}`;
        if (data.stage_label_bn) {
          setStageUi(data.stage_label_bn, data.current_stage && data.current_stage !== "IDLE");
        }
      } catch {
        document.getElementById("dot").className = "dot err";
        document.getElementById("status").textContent = "Backend Offline";
      }
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErr();
      const btn = document.getElementById("gen-btn");
      const secVal = Math.max(1, Math.min(parseInt(document.getElementById("clip_seconds").value, 10) || 5, 10));
      btn.disabled = true;
      btn.textContent = "তৈরি হচ্ছে...";
      setStageUi("আইডিয়া, সিন প্ল্যান ও মিডিয়া সংযোগ চলছে...", true);
      startStagePolling(1600);
      try {
        const res = await fetch("/api/generate-plan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            niche: document.getElementById("niche").value,
            topic: document.getElementById("topic").value,
            language: document.getElementById("language").value,
            format_type: document.getElementById("format_type").value,
            duration: `${secVal} seconds`,
            visual_style: document.getElementById("visual_style").value,
          }),
        });
        const data = await parseJsonSafe(res);
        if (!res.ok || !data.plan) throw new Error(data.error || "ত্রুটি হয়েছে");
        currentPlan = data.plan;
        document.getElementById("title").textContent = data.plan.title || "";
        document.getElementById("hook").textContent = "Hook: " + (data.plan.hook || "");
        document.getElementById("script").textContent = data.plan.voiceover_script || "";
        document.getElementById("thumb").textContent = data.plan.thumbnail_prompt || "";
        document.getElementById("api-info").textContent = JSON.stringify(
          data.media_sources || { pexels: data.pexels, pixverse: data.pixverse },
          null,
          2
        );

        const scWrap = document.getElementById("scenes");
        scWrap.innerHTML = "";
        (data.plan.scenes || []).forEach((s, i) => {
          const d = document.createElement("div");
          d.className = "scene";
          d.innerHTML = `<strong>Scene ${s.scene_number || i + 1} (${s.duration || `${secVal}s`})</strong>
            <div>Visual: ${s.visual_prompt || ""}</div>
            <div>Narration: ${s.narration || ""}</div>
            <div>Text: ${s.on_screen_text || ""}</div>`;
          scWrap.appendChild(d);
        });
        document.getElementById("result").style.display = "block";
      } catch (err) {
        showErr(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate Script & Plan";
        await fetchBrainMonitor();
        stopStagePolling();
      }
    });

    document.getElementById("tts-btn").addEventListener("click", async () => {
      clearErr();
      const btn = document.getElementById("tts-btn");
      const text = document.getElementById("script").textContent || document.getElementById("topic").value;
      const lang = document.getElementById("language").value;
      btn.disabled = true;
      setStageUi("ভয়েস তৈরি ও পরিশোধন ফিল্টার চলছে...", true);
      startStagePolling(1500);
      try {
        const res = await fetch("/api/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, language: lang }),
        });
        const data = await parseJsonSafe(res);
        if (!res.ok || !data.ok) throw new Error(data.error || "TTS ব্যর্থ হয়েছে");
        const mon = await fetchBrainMonitor();
        document.getElementById("media-card").style.display = "block";
        document.getElementById("media-out").innerHTML =
          `<audio controls src="${data.file}"></audio>` +
          renderLiveFeedIntoMedia(mon && mon.telemetry && mon.telemetry.recent_events);
      } catch (err) {
        showErr(err.message);
      } finally {
        btn.disabled = false;
        await fetchBrainMonitor();
        stopStagePolling();
      }
    });

    document.getElementById("clip-btn").addEventListener("click", async () => {
      clearErr();
      const btn = document.getElementById("clip-btn");
      const secVal = Math.max(1, Math.min(parseInt(document.getElementById("clip_seconds").value, 10) || 5, 10));
      const fmtVal = document.getElementById("format_type").value;
      btn.disabled = true;
      setStageUi(`${secVal}s ক্লিপ ডাউনলোড ও রেন্ডার হচ্ছে...`, true);
      startStagePolling(1500);
      try {
        let res = await fetch("/api/build-clips", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ clip_seconds: secVal, clip_count: 1, label: "selected_clip", format_type: fmtVal }),
        });
        if (res.status === 404) {
          res = await fetch("/api/moviepy-sample", { method: "POST" });
        }
        const data = await parseJsonSafe(res);
        if (!res.ok || !data.ok) throw new Error(data.error || "ক্লিপ তৈরি হয়নি");
        const videoSrc = data.merged_file || data.file;
        const mon = await fetchBrainMonitor();
        document.getElementById("media-card").style.display = "block";
        document.getElementById("media-out").innerHTML =
          `<video controls width="360" src="${videoSrc}"></video>` +
          renderLiveFeedIntoMedia(mon && mon.telemetry && mon.telemetry.recent_events);
      } catch (err) {
        showErr(err.message);
      } finally {
        btn.disabled = false;
        await fetchBrainMonitor();
        stopStagePolling();
      }
    });

    document.getElementById("step-clip-btn").addEventListener("click", async () => {
      clearErr();
      const btn = document.getElementById("step-clip-btn");
      const maxSec = Math.max(1, Math.min(parseInt(document.getElementById("clip_seconds").value, 10) || 5, 10));
      const stepList = maxSec >= 10 ? [1, 2, 3, 5, 10] : Array.from({ length: maxSec }, (_, i) => i + 1);
      const fmtVal = document.getElementById("format_type").value;
      btn.disabled = true;
      setStageUi(`১s–${maxSec}s ধাপে ক্লিপ ডাউনলোড ও এডিটিং চলছে...`, true);
      startStagePolling(1500);
      try {
        const res = await fetch("/api/build-steps", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ durations: stepList, label: "step_clip", format_type: fmtVal }),
        });
        const data = await parseJsonSafe(res);
        if (!res.ok || !data.ok) throw new Error(data.error || "স্টেপ ক্লিপ তৈরি হয়নি");
        const videoSrc = data.merged_file || (data.clips && data.clips[0] && data.clips[0].file);
        const mon = await fetchBrainMonitor();
        document.getElementById("media-card").style.display = "block";
        document.getElementById("media-out").innerHTML =
          `<video controls width="360" src="${videoSrc}"></video>` +
          renderLiveFeedIntoMedia(mon && mon.telemetry && mon.telemetry.recent_events);
      } catch (err) {
        showErr(err.message);
      } finally {
        btn.disabled = false;
        await fetchBrainMonitor();
        stopStagePolling();
      }
    });

    document.getElementById("copy-btn").addEventListener("click", async () => {
      const t = document.getElementById("script").textContent;
      if (t) {
        await navigator.clipboard.writeText(t);
        alert("Script কপি হয়েছে!");
      }
    });

    document.getElementById("dl-btn").addEventListener("click", () => {
      if (!currentPlan) return;
      const b = new Blob([JSON.stringify(currentPlan, null, 2)], { type: "application/json" });
      const u = URL.createObjectURL(b);
      const a = document.createElement("a");
      a.href = u;
      a.download = "plan.json";
      a.click();
      URL.revokeObjectURL(u);
    });

    checkHealth();
  </script>
</body>
</html>
