<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">চিঠি এআই রোবট - সুপার কন্ট্রোল</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background: linear-gradient(135deg, #05050e 0%, #121225 100%); 
            color: #00ffcc; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .box { 
            border: 2px solid rgba(0, 255, 204, 0.3); 
            padding: 20px; 
            border-radius: 20px; 
            width: 100%;
            max-width: 450px; 
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.15); 
            background: rgba(16, 16, 26, 0.85); 
            backdrop-filter: blur(10px);
        }

        h2 {
            font-size: 22px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffcc;
        }

        #robotFace {
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 15px;
            margin: 10px auto;
            display: block;
            box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            margin-bottom: 10px;
        }

        #reply { 
            margin: 10px 0; 
            min-height: 55px; 
            font-size: 15px; 
            line-height: 1.5; 
            color: #ffffff; 
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 10px;
            border-left: 3px solid #00ffcc;
            text-align: left;
        }

        /* লাইভ সেন্সর ড্যাশবোর্ড CSS */
        .sensor-container {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #00ffcc;
            margin: 10px 0;
            font-size: 14px;
        }

        .switches-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .switch-btn {
            background: #18182a;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .switch-btn:hover {
            background: #00ffcc;
            color: #000;
        }

        .input-group {
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px;
            margin-top: 10px;
        }

        input[type="text"] { 
            background: #000; 
            border: 1px solid #00ffcc; 
            color: #00ffcc; 
            padding: 10px; 
            flex: 1;
            border-radius: 8px; 
            outline: none; 
            font-size: 14px; 
        }

        .send-btn { 
            background: #00ffcc; 
            color: #000; 
            border: none; 
            padding: 10px 15px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
        }

        .mic-btn { 
            background: #ff0055; 
            color: white; 
            border: none;
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            cursor: pointer;
            box-shadow: 0 0 10px #ff0055;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="appHeader">🤖 চিঠি এআই রোবট</h2>
        <div class="status-badge" id="roleBadge">ইউজার মোড: Guest</div>
        
        <!-- অ্যানিমেটেড রোবট ফেস -->
        <canvas id="robotFace" width="280" height="120"></canvas>

        <div id="reply">আমি প্রস্তুত! আপনার নির্দেশ দিন।</div>

        <!-- লাইভ সেন্সর ডাটা ড্যাশবোর্ড -->
        <div class="sensor-container">
            <div>🌡️ তাপমাত্রা: <span id="tempVal">--</span>°C</div>
            <div>🔥 গ্যাস: <span id="gasVal">স্বাভাবিক</span></div>
        </div>

        <!-- ফিক্সড হোম কন্ট্রোল সুইচ -->
        <div class="switches-grid">
            <button class="switch-btn" onclick="toggleDevice('light')">💡 লাইট অন/অফ</button>
            <button class="switch-btn" onclick="toggleDevice('fan')">🌀 ফ্যান অন/অফ</button>
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="কমান্ড লিখুন বা ভয়েস দিন...">
            <button class="send-btn" onclick="sendMsg()">পাঠান</button>
            <button class="mic-btn" onclick="startVoice()">🎤</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://chitti-bfa21-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // ফায়ারবেস থেকে লাইভ সেন্সর ডাটা পড়া
        firebase.database().ref('sensors').on('value', function(snapshot) {
            const data = snapshot.val();
            if (data) {
                if (data.temperature) document.getElementById('tempVal').innerText = data.temperature;
                if (data.gas) document.getElementById('gasVal').innerText = data.gas;
            }
        });

        const SERVER_URL = "https://chitti-robot-qh89.onrender.com/chat";
        
        const canvas = document.getElementById('robotFace');
        const ctx = canvas.getContext('2d');
        let eyeState = 'idle';

        function drawFace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ffcc";

            if (eyeState === 'listening') {
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#00ffcc";
                ctx.beginPath();
                ctx.arc(80, 50, 22, 0, Math.PI * 2);
                ctx.arc(200, 50, 22, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.shadowBlur = 5;
                ctx.shadowColor = "#00ffcc";
                ctx.fillRect(60, 40, 40, 20);
                ctx.fillRect(180, 40, 40, 20);
            }

            ctx.beginPath();
            if (eyeState === 'speaking') {
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#ff0055";
                let randomHeight = Math.random() * 15 + 5;
                ctx.moveTo(100, 95 - randomHeight);
                ctx.lineTo(140, 95 + randomHeight);
                ctx.lineTo(180, 95 - randomHeight);
                ctx.stroke();
            } else {
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#00ffcc";
                ctx.moveTo(100, 95);
                ctx.lineTo(180, 95);
                ctx.stroke();
            }
        }
        setInterval(drawFace, 150);

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Google Chrome ব্যবহার করুন।");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';
            eyeState = 'listening';
            recognition.start();

            document.getElementById('reply').innerText = "শুনছি, বলুন...";

            recognition.onresult = function(event) {
                let text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                sendMsg();
            };

            recognition.onend = function() {
                eyeState = 'idle';
            };
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                eyeState = 'speaking';
                
                utterance.onend = function() {
                    eyeState = 'idle';
                };
                window.speechSynthesis.speak(utterance);
            }
        }

        async function sendMsg() {
            let input = document.getElementById('userInput');
            let replyDiv = document.getElementById('reply');
            let msg = input.value.trim();
            if(!msg) return;

            replyDiv.innerText = "প্রসেস করা হচ্ছে...";
            input.value = "";

            try {
                let res = await fetch(SERVER_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        message: msg,
                        user_id: "owner_voice_sample"
                    })
                });

                let data = await res.json();
                replyDiv.innerText = data.reply;
                if(data.user_role) {
                    document.getElementById('roleBadge').innerText = "ইউজার মোড: " + data.user_role;
                }
                speakText(data.reply);

            } catch (err) {
                replyDiv.innerText = "সার্ভারের সাথে সংযোগ বিচ্ছিন্ন হয়েছে!";
                eyeState = 'idle';
            }
        }

        function toggleDevice(device) {
            document.getElementById('userInput').value = device + " অন অফ করো";
            sendMsg();
        }
    </script>
</body>
</html>
