<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chitti AI - Autonomous Control Center & PCB Hub</title>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: #111827;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-purple: #818cf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--accent-blue);
            font-size: 24px;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(52, 211, 153, 0.1);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 15px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 500px) {
            .actions {
                grid-template-columns: 1fr;
            }
        }

        button {
            background-color: var(--accent-purple);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(129, 140, 248, 0.2);
        }

        button:hover {
            background-color: #6366f1;
            transform: translateY(-2px);
        }

        button.btn-pcb {
            background-color: #0284c7;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        button.btn-pcb:hover {
            background-color: #0369a1;
        }

        .console-box {
            background-color: #030712;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: var(--accent-green);
            max-height: 280px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .console-title {
            color: var(--text-sub);
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🤖 Chitti AI Autonomous Control Center</h1>
            <p>100% Zero Human Effort: AI-Powered YouTube Growth, Automatic PCB Routing, Viral SEO & Monetization Pipelines.</p>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="liveStatus">Render Cloud Server: Connected</span>
            </div>
        </div>

        <div class="actions">
            <button onclick="triggerAIEngine()">🚀 Generate AI Viral Content</button>
            <button class="btn-pcb" onclick="generatePCBFiles()">🔌 Run PCB Design & Gerber AI</button>
        </div>

        <div class="console-title">Console Output & Income Analytics:</div>
        <div class="console-box" id="consoleOutput">System Initialized. Ready to connect with Render Backend & ESP32 Hardware Bridge...</div>
    </div>

    <script>
        // আপনার লাইভ রেন্ডার ক্লাউড ব্যাকএন্ড ইউআরএল
        const BACKEND_URL = 'https://chitti-robot-qh88.onrender.com';

        // ১. অটোমেটেড ভিডিও প্রজেক্ট ও ইনকাম পাইপলাইন ট্রিগার
        async function triggerAIEngine() {
            const consoleBox = document.getElementById('consoleOutput');
            consoleBox.innerText = "[AI WORKING]: Analyzing YouTube algorithm trends, drafting titles, tags, and monetization strategy...";

            try {
                let response = await fetch(`${BACKEND_URL}/api/ai/autonomous-engine`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ niche: "Advanced ESP32 Wireless Mesh & AI Automation" })
                });

                let data = await response.json();
                consoleBox.innerText = JSON.stringify(data.package, null, 2);
            } catch (error) {
                consoleBox.innerText = "[ERROR]: Could not connect to Render Backend. Please make sure the service is live.\nDetails: " + error.message;
            }
        }

        // ২. অটোমেটেড পিসিবি ও গারবার ফাইল জেনারেশন ট্রিগার
        async function generatePCBFiles() {
            const consoleBox = document.getElementById('consoleOutput');
            consoleBox.innerText = "[PCB AI]: Routing traces, checking DRC, generating Gerber & BOM Assembly files...";

            try {
                let response = await fetch(`${BACKEND_URL}/api/ai/autonomous-engine`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ niche: "EasyEDA Auto-Routed ESP32 PCB Layout" })
                });

                let data = await response.json();
                
                // পিসিবি স্পেসিফিক মেসেজ দেখানো
                let pcbOutput = {
                    "system": "PCB & Gerber Generator Engine",
                    "status": "Completed",
                    "gerber_file": "ESP32_Master_Board_v1.0.zip",
                    "routing_rules": "Auto-routed via ERC/DRC Rules",
                    "order_link": "Ready for 1-Click Fabrication (JLCPCB/PCBWay)",
                    "details": data.package
                };

                consoleBox.innerText = JSON.stringify(pcbOutput, null, 2);
            } catch (error) {
                consoleBox.innerText = "[ERROR]: Failed to connect with PCB AI Generator Engine.";
            }
        }

        // পেজ লোড হওয়ার সাথে সাথে ব্যাকএন্ডের কানেকশন টেস্ট করা
        async function checkBackendHealth() {
            try {
                let response = await fetch(`${BACKEND_URL}/api/webhook/status`);
                let data = await response.json();
                if (data.status === 'online') {
                    document.getElementById('liveStatus').innerText = "Render Cloud Server: Online & Active";
                }
            } catch (e) {
                document.getElementById('liveStatus').innerText = "Render Cloud Server: Standby";
            }
        }

        checkBackendHealth();
    </script>
</body>
</html>
