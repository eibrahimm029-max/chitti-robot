<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Chitti Robot - Final Fix</title>
    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            justify-content: space-between;
        }

        #robot-face-box {
            width: 100%;
            max-width: 350px;
            height: 140px;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            padding: 8px;
            box-sizing: border-box;
            text-align: center;
        }

        .eye-container {
            display: flex;
            justify-content: space-around;
            width: 60px;
            margin-bottom: 5px;
        }
        .eye {
            width: 12px;
            height: 20px;
            background: #00ffcc;
            border-radius: 6px;
        }

        #robot-status {
            font-size: 11px;
            color: #00ffcc;
            line-height: 1.2;
            max-height: 45px;
            overflow: hidden;
        }

        .debug-panel {
            width: 100%;
            max-width: 350px;
            background: #0d1117;
            border: 1px solid #ff0055;
            padding: 8px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 10px;
            color: #ff3366;
            height: 110px;
            overflow-y: auto;
            text-align: left;
        }

        .control-panel {
            width: 100%;
            max-width: 350px;
            background: #0d1117;
            border: 1px solid #1f293d;
            padding: 8px;
            border-radius: 8px;
            box-sizing: border-box;
            display: flex;
            gap: 5px;
        }

        .control-panel input {
            flex: 1;
            background: #000;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .control-panel button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="robot-face-box">
        <div class="eye-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <h3 id="ai-name" style="margin: 0 0 2px 0; color: #fff; font-size: 13px;">চিঠি রোবট</h3>
        <p id="robot-status">এপিআই কানেক্ট করা হয়েছে...</p>
    </div>

    <div class="debug-panel" id="debug-log">
        <strong>🛡️ লাইভ ডিবাগ কনসোল:</strong><br>
        > সিস্টেম রেডি...
    </div>

    <div class="control-panel">
        <input type="text" id="user-input" placeholder="এখানে কমান্ড লিখুন..." autocomplete="off">
        <button onclick="sendManualCommand()">পাঠান</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDu3WADHPHQSHPJd1zoa5Z4TGVEP0cl_8g",
          authDomain: "chitti-bfa21.firebaseapp.com",
          databaseURL: "https://chitti-bfa21-default-rtdb.firebaseio.com",
          projectId: "chitti-bfa21",
          storageBucket: "chitti-bfa21.firebasestorage.app",
          messagingSenderId: "192136261108",
          appId: "1:192136261108:web:bf2290d269fa7a3391dda1",
          measurementId: "G-D6JM85X76F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // আপনার নতুন এপিআই কি এখানে সঠিকভাবে বসানো হয়েছে
        const GEMINI_API_KEY = "AQ.Ab8RN6L4f5NHgS_MhbNUag4zEV0ORA9lzdGCULdL8DnpepWjOQ";

        let robotMemory = { name: "চিঠি রোবট", rules: [] };

        function logDebug(msg) {
            const debugBox = document.getElementById('debug-log');
            debugBox.innerHTML += `<br>> ${msg}`;
            debugBox.scrollTop = debugBox.scrollHeight;
        }

        window.onload = function() {
            loadFirebaseMemory();
            speakAndDisplay("হ্যালো ওনার! আমি সম্পূর্ণ প্রস্তুত আছি।");
        };

        function loadFirebaseMemory() {
            const dbRef = ref(db, 'chitti_ai_core/');
            onValue(dbRef, (snapshot) => {
                let data = snapshot.val();
                if (data && data.name) {
                    robotMemory.name = data.name;
                    document.getElementById('ai-name').innerText = data.name;
                }
            });
        }

        window.sendManualCommand = function() {
            let inputField = document.getElementById('user-input');
            let text = inputField.value.trim();
            if (text.length > 0) {
                logDebug(`কমান্ড পাওয়া গেছে: "${text}"`);
                inputField.value = "";
                processWithGeminiAI(text);
            }
        };

        async function processWithGeminiAI(userInput) {
            speakAndDisplay("প্রসেস হচ্ছে...");
            logDebug(`জেমিনি এপিআই এ রিকোয়েস্ট পাঠানো হচ্ছে...`);

            try {
                let prompt = `তুমি একজন অটোনমাস রোবট যার নাম "${robotMemory.name}"। ইউজার একটি কমান্ড দিয়েছেন: "${userInput}". শুধু সাবলীল বাংলায় উত্তর দাও।`;

                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                let result = await response.json();
                
                if (result.candidates && result.candidates[0].content) {
                    let aiReply = result.candidates[0].content.parts[0].text;
                    logDebug(`সফল রেসপন্স প্রাপ্ত.`);
                    speakAndDisplay(aiReply);
                } else {
                    throw new Error("জেমিনি থেকে সঠিক ফরম্যাটে ডেটা আসেনি।");
                }

            } catch (error) {
                logDebug(`ত্রুটি ধরা পড়েছে: ${error.message}`);
                speakAndDisplay("সার্ভার এরর: দয়া করে চেক করুন।");
            }
        }

        function speakAndDisplay(text) {
            document.getElementById('robot-status').innerText = text;
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
