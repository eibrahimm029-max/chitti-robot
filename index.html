<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">চিঠি রোবট - অটোমেশন এআই</title>
    
    <!-- Firebase JS SDK (v8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { 
            background: #080810; 
            color: #00ffcc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 20px; 
            transition: all 0.5s ease;
        }
        .box { 
            border: 2px solid #00ffcc; 
            padding: 25px; 
            border-radius: 15px; 
            max-width: 450px; 
            margin: auto; 
            box-shadow: 0 0 20px #00ffcc; 
            background: #10101a; 
            transition: all 0.5s ease;
        }
        h2 { margin-bottom: 10px; }
        input { 
            background: #000; 
            border: 1px solid #00ffcc; 
            color: #00ffcc; 
            padding: 12px; 
            width: 55%; 
            border-radius: 8px; 
            outline: none; 
            font-size: 15px; 
        }
        button { 
            background: #00ffcc; 
            color: #000; 
            border: none; 
            padding: 12px 15px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 15px; 
            transition: all 0.3s ease;
        }
        .mic-btn { 
            background: #ff0055; 
            color: white; 
            border-radius: 50%; 
            width: 48px; 
            height: 48px; 
            border: none; 
            margin-left: 5px; 
            cursor: pointer; 
            font-size: 20px; 
        }
        #reply { 
            margin-top: 20px; 
            min-height: 60px; 
            font-size: 17px; 
            word-wrap: break-word; 
            line-height: 1.5; 
            color: #ffffff; 
            background: #00000055;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="box" id="mainBox">
        <h2 id="appHeader">🤖 চিঠি অটোমেটেড রোবট</h2>
        <div id="reply">আমি প্রস্তুত! কথা বলতে মাইক্রোফোনে চাপ দিন অথবা বার্তা লিখুন।</div>
        <br>
        <div id="controlsContainer" style="display:flex; justify-content:center; align-items:center; gap: 5px;">
            <input type="text" id="userInput" placeholder="কথা বলুন বা লিখুন...">
            <button id="sendBtn" onclick="sendMsg()">পাঠান</button>
            <button id="micBtn" class="mic-btn" onclick="startVoice()" title="ভয়েস ইনপুট">🎤</button>
        </div>
    </div>

    <script>
        // ==========================================
        // ১. ফায়ারবেস কনফিগারেশন ও ডাইনামিক UI লিসেনার
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://chitti-bfa21-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // ফায়ারবেসের ui_config নোড রিয়েলটাইমে মনিটর করা
        const uiRef = firebase.database().ref('ui_config');
        uiRef.on('value', function(snapshot) {
            const config = snapshot.val();
            if (config) {
                // ১. ব্যাকগ্রাউন্ড কালার পরিবর্তন
                if (config.bg_color) {
                    document.body.style.backgroundColor = config.bg_color;
                }
                
                // ২. অ্যাপের শিরোনাম/টাইটেল পরিবর্তন
                if (config.app_title) {
                    document.getElementById('appHeader').innerText = "🤖 " + config.app_title;
                    document.getElementById('pageTitle').innerText = config.app_title;
                }
                
                // ৩. ইনপুট ও বাটনসমূহ হাইড/শো করা
                if (config.show_buttons !== undefined) {
                    const controls = document.getElementById('controlsContainer');
                    if (controls) {
                        controls.style.display = config.show_buttons ? 'flex' : 'none';
                    }
                }
            }
        });

        // ==========================================
        // ২. চ্যাট ও ভয়েস লজিক
        // ==========================================
        const SERVER_URL = "https://chitti-robot-qh89.onrender.com/chat";
        let conversationHistory = [];

        // ভয়েস ইনপুট শুরু করা (Speech Recognition)
        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("আপনার ব্রাউজার ভয়েস সাপোর্ট করে না। Google Chrome ব্যবহার করুন।");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD'; // বাংলা ভাষা
            recognition.start();

            document.getElementById('reply').innerText = "শুনছি, বলুন...";

            recognition.onresult = function(event) {
                let text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                sendMsg();
            };
        }

        // এআই উত্তর মুখে উচ্চারণ করা (Text to Speech)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                window.speechSynthesis.speak(utterance);
            }
        }

        // মেসেজ পাঠানো ও প্রসেস করা
        async function sendMsg() {
            let input = document.getElementById('userInput');
            let replyDiv = document.getElementById('reply');
            let msg = input.value.trim();
            if(!msg) return;

            replyDiv.innerText = "চিন্তা করছি...";
            input.value = "";

            try {
                let res = await fetch(SERVER_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        message: msg,
                        history: conversationHistory
                    })
                });

                let data = await res.json();
                replyDiv.innerText = data.reply;
                speakText(data.reply); // স্পিকারে উত্তর দেবে

                // কথোপকথন মেমোরিতে সংরক্ষণ
                conversationHistory.push({"role": "user", "content": msg});
                conversationHistory.push({"role": "assistant", "content": data.reply});

            } catch (err) {
                replyDiv.innerText = "সার্ভারের সাথে সংযোগ বিচ্ছিন্ন হয়েছে!";
            }
        }
    </script>
</body>
</html>
