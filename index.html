<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Chitti Robot - Secure Firebase Remote</title>
    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            justify-content: space-between;
        }

        #robot-face-box {
            width: 100%;
            max-width: 350px;
            height: 140px;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            padding: 8px;
            box-sizing: border-box;
            text-align: center;
        }

        .eye-container {
            display: flex;
            justify-content: space-around;
            width: 60px;
            margin-bottom: 5px;
        }
        .eye {
            width: 12px;
            height: 20px;
            background: #00ffcc;
            border-radius: 6px;
        }

        #robot-status {
            font-size: 11px;
            color: #00ffcc;
            line-height: 1.2;
            max-height: 45px;
            overflow: hidden;
        }

        .debug-panel {
            width: 100%;
            max-width: 350px;
            background: #0d1117;
            border: 1px solid #00ffcc;
            padding: 8px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 10px;
            color: #00ffcc;
            height: 110px;
            overflow-y: auto;
            text-align: left;
        }

        .control-panel {
            width: 100%;
            max-width: 350px;
            background: #0d1117;
            border: 1px solid #1f293d;
            padding: 8px;
            border-radius: 8px;
            box-sizing: border-box;
            display: flex;
            gap: 5px;
        }

        .control-panel input {
            flex: 1;
            background: #000;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .control-panel button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="robot-face-box">
        <div class="eye-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <h3 id="ai-name" style="margin: 0 0 2px 0; color: #fff; font-size: 13px;">চিঠি রোবট</h3>
        <p id="robot-status">ডাটাবেজ থেকে সিকিউর লোডিং...</p>
    </div>

    <div class="debug-panel" id="debug-log">
        <strong>🛡️ রিমোট সিকিউর কনসোল:</strong><br>
        > সিস্টেম লোড হচ্ছে...
    </div>

    <div class="control-panel">
        <input type="text" id="user-input" placeholder="এখানে কমান্ড লিখুন..." autocomplete="off">
        <button onclick="sendManualCommand()">পাঠান</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDu3WADHPHQSHPJd1zoa5Z4TGVEP0cl_8g",
          authDomain: "chitti-bfa21.firebaseapp.com",
          databaseURL: "https://chitti-bfa21-default-rtdb.firebaseio.com",
          projectId: "chitti-bfa21",
          storageBucket: "chitti-bfa21.firebasestorage.app",
          messagingSenderId: "192136261108",
          appId: "1:192136261108:web:bf2290d269fa7a3391dda1",
          measurementId: "G-D6JM85X76F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let robotMemory = { name: "চিঠি রোবট" };
        let dynamicApiKey = "";

        function logDebug(msg) {
            const debugBox = document.getElementById('debug-log');
            debugBox.innerHTML += `<br>> ${msg}`;
            debugBox.scrollTop = debugBox.scrollHeight;
        }

        window.onload = function() {
            loadFirebaseConfigs();
            speakAndDisplay("হ্যালো ওনার! আমি চিঠি রোবট, প্রস্তুত আছি।");
        };

        // ফায়ারবেস থেকে নাম এবং এপিআই কি রিমোটলি লোড করা (উভয় পাথ থেকে সাপোর্ট করবে)
        function loadFirebaseConfigs() {
            onValue(ref(db, 'chitti_ai_core/'), (snapshot) => {
                let data = snapshot.val();
                if (data) {
                    if (data.name) {
                        robotMemory.name = data.name;
                        document.getElementById('ai-name').innerText = data.name;
                    }
                    if (data.gemini_key) {
                        dynamicApiKey = data.gemini_key;
                        logDebug("রিমোট এপিআই কি সফলভাবে লোড হয়েছে।");
                    }
                }
            });

            onValue(ref(db, 'gemini_key'), (snapshot) => {
                let key = snapshot.val();
                if (key && !dynamicApiKey) {
                    dynamicApiKey = key;
                    logDebug("রিমোট এপিআই কি সফলভাবে লোড হয়েছে।");
                }
            });
        }

        window.sendManualCommand = function() {
            let inputField = document.getElementById('user-input');
            let text = inputField.value.trim();
            if (text.length > 0) {
                if (!dynamicApiKey) {
                    logDebug("ত্রুটি: এপিআই কি লোড হয়নি।");
                    speakAndDisplay("এপিআই কি পাওয়া যায়নি।");
                    return;
                }
                logDebug(`কমান্ড পাঠানো হলো: "${text}"`);
                inputField.value = "";
                processWithAI(text);
            }
        };

        // হাগিং ফেস ফ্রি এআই মডেলের মাধ্যমে প্রসেস করার ফাংশন
        async function processWithAI(userInput) {
            speakAndDisplay("ভাবছি...");
            logDebug(`এআই সার্ভারে রিকোয়েস্ট পাঠানো হচ্ছে...`);

            try {
                const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${dynamicApiKey.trim()}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: `[INST] তুমি একজন অটোনমাস রোবট। তোমার নাম "${robotMemory.name}"। তুমি সবসময় নিজেকে "${robotMemory.name}" হিসেবে পরিচয় দেবে এবং বাংলায় সাবলীল সংক্ষিপ্ত উত্তর দেবে। ব্যবহারকারীর কথা: ${userInput} [/INST]`
                    })
                });

                let result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || `HTTP Error: ${response.status}`);
                }

                let aiReply = "";
                if (Array.isArray(result) && result[0].generated_text) {
                    aiReply = result[0].generated_text.split("[/INST]").pop().trim();
                } else if (result.generated_text) {
                    aiReply = result.generated_text.split("[/INST]").pop().trim();
                } else {
                    aiReply = "আমি বুঝতে পেরেছি!";
                }

                logDebug(`সফল রেসপন্স প্রাপ্ত!`);
                speakAndDisplay(aiReply);

            } catch (error) {
                logDebug(`ত্রুটি: ${error.message}`);
                speakAndDisplay("হ্যাঁ, আমি শুনতে পাচ্ছি।");
            }
        }

        function speakAndDisplay(text) {
            document.getElementById('robot-status').innerText = text;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
