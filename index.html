<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVS Neural Production Studio - Autonomous AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .app-container { max-width: 900px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 25px; }
        .logo-area h1 { margin: 0; font-size: 22px; color: var(--accent-color); display: flex; align-items: center; gap: 10px; }
        .status-pill { background: rgba(34, 197, 94, 0.15); color: var(--success-color); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .action-btn { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 16px 20px; font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .action-btn:hover { background: linear-gradient(135deg, #0369a1, #075985); }
        .output-section { margin-top: 25px; background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        
        /* Loading Spinner Style */
        .loading-box { display: none; text-align: center; padding: 20px; color: var(--accent-color); font-weight: 600; }
        .spinner { border: 4px solid rgba(56, 189, 248, 0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--accent-color); animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .video-container { margin-top: 15px; text-align: center; display: none; }
        video { width: 100%; max-height: 400px; border-radius: 10px; border: 2px solid var(--border-color); background: #000; outline: none; }
        .download-btn { background: #059669; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; margin-top: 15px; }
        .download-btn:hover { background: #047857; }
        .ai-details { background: #1e293b; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 14px; color: #94a3b8; border-left: 4px solid var(--accent-color); text-align: left; display: none; }
        .ai-details span { color: #f8fafc; font-weight: bold; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1><i class="fa-solid fa-brain"></i> AVS Neural Studio</h1>
            </div>
            <div class="status-pill" id="server-status">
                <i class="fa-solid fa-circle-dot"></i> Connecting AI...
            </div>
        </div>

        <button class="action-btn" id="trigger-btn" onclick="triggerProduction()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> 🤖 AI: Start Autonomous Production & Render
        </button>

        <div class="output-section">
            <h3 id="status-title" style="color: #38bdf8; margin-top:0;"><i class="fa-solid fa-terminal"></i> AI Studio Status: Ready</h3>
            
            <!-- Live Loading Spinner (AI Chat Style) -->
            <div id="loading-spinner" class="loading-box">
                <div class="spinner"></div>
                <p>🤖 AI Brain is scouting trends, writing script, and rendering 4K video... Please wait.</p>
            </div>

            <!-- AI Decisions Summary -->
            <div id="ai-info" class="ai-details">
                <p>📌 <b>Niche & Trend:</b> <span id="niche-text"></span></p>
                <p>💡 <b>Zero-Drop Hook:</b> <span id="hook-text"></span></p>
                <p>⏱️ <b>Estimated Duration:</b> <span id="duration-text">1:30 Minutes</span></p>
            </div>

            <!-- Real Video Player -->
            <div id="video-box" class="video-container">
                <video id="ai-video-player" controls>
                    Your browser does not support the video tag.
                </video>
                <br>
                <a id="download-btn" class="download-btn" href="#" download>
                    <i class="fa-solid fa-download"></i> Download Final Video (MP4)
                </a>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://chitti-robot-qh89.onrender.com";

        fetch(BACKEND_URL + '/')
            .then(res => res.json())
            .then(data => {
                document.getElementById('server-status').innerHTML = `<i class="fa-solid fa-circle-dot"></i> ${data.status}`;
            }).catch(err => {
                document.getElementById('server-status').innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> OFFLINE`;
                document.getElementById('server-status').style.color = '#ef4444';
            });

        function triggerProduction() {
            const statusTitle = document.getElementById('status-title');
            const loadingSpinner = document.getElementById('loading-spinner');
            const videoBox = document.getElementById('video-box');
            const aiInfo = document.getElementById('ai-info');
            const videoPlayer = document.getElementById('ai-video-player');
            const downloadBtn = document.getElementById('download-btn');
            const triggerBtn = document.getElementById('trigger-btn');

            // Reset & Show Loading
            statusTitle.innerHTML = "⏳ AI Processing in Progress...";
            loadingSpinner.style.display = "block";
            videoBox.style.display = "none";
            aiInfo.style.display = "none";
            triggerBtn.disabled = true;
            triggerBtn.style.opacity = "0.6";

            fetch(BACKEND_URL + '/trigger-manual-production')
                .then(res => res.json())
                .then(data => {
                    loadingSpinner.style.display = "none";
                    triggerBtn.disabled = false;
                    triggerBtn.style.opacity = "1";
                    statusTitle.innerHTML = "✅ Video Produced Successfully by AI!";

                    if(data.autonomous_ai_decision) {
                        aiInfo.style.display = "block";
                        document.getElementById('niche-text').innerText = data.autonomous_ai_decision.scanned_trend || "Viral Tech Trend";
                        document.getElementById('hook-text').innerText = data.autonomous_ai_decision.retention_hook || "Amazing Hook";
                        document.getElementById('duration-text').innerText = data.duration || "1:30 Minutes";
                    }

                    if (data.video_download_url) {
                        videoBox.style.display = "block";
                        videoPlayer.src = data.video_download_url;
                        videoPlayer.load();
                        downloadBtn.href = data.video_download_url;
                    }
                })
                .catch(err => {
                    loadingSpinner.style.display = "none";
                    triggerBtn.disabled = false;
                    triggerBtn.style.opacity = "1";
                    statusTitle.innerHTML = "❌ Error: " + err;
                });
        }
    </script>
</body>
</html>
