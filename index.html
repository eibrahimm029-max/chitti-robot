<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">চিঠি রোবট - ডায়নামিক এআই</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { 
            background: #080810; 
            color: #00ffcc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 20px; 
            transition: all 0.5s ease;
        }
        .box { 
            border: 2px solid #00ffcc; 
            padding: 25px; 
            border-radius: 15px; 
            max-width: 480px; 
            margin: auto; 
            box-shadow: 0 0 20px #00ffcc; 
            background: #10101a; 
            transition: all 0.5s ease;
        }
        input[type="text"] { 
            background: #000; 
            border: 1px solid #00ffcc; 
            color: #00ffcc; 
            padding: 12px; 
            width: 50%; 
            border-radius: 8px; 
            outline: none; 
            font-size: 15px; 
        }
        button { 
            background: #00ffcc; 
            color: #000; 
            border: none; 
            padding: 12px 15px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 15px; 
        }
        .mic-btn { 
            background: #ff0055; 
            color: white; 
            border-radius: 50%; 
            width: 44px; 
            height: 44px; 
        }
        #reply { 
            margin-top: 20px; 
            min-height: 60px; 
            font-size: 17px; 
            line-height: 1.5; 
            color: #ffffff; 
            background: #00000055;
            padding: 10px;
            border-radius: 8px;
        }
        #dynamicFeatureArea {
            margin-top: 15px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .feature-wrapper {
            display: inline-block;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="appHeader">🤖 চিঠি অটোমেটেড রোবট</h2>
        <div id="reply">আমি প্রস্তুত! আপনার যেকোনো নির্দেশ দিন।</div>
        
        <!-- নতুন হাজার হাজার ডায়নামিক ফিচার বা বাটন এখানে জমা হবে -->
        <div id="dynamicFeatureArea"></div>

        <br>
        <div style="display:flex; justify-content:center; align-items:center; gap: 5px;">
            <input type="text" id="userInput" placeholder="কথা বলুন বা লিখুন...">
            <button onclick="sendMsg()">পাঠান</button>
            <button class="mic-btn" onclick="startVoice()">🎤</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://chitti-bfa21-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // কালার ও অ্যাপ টাইটেল পাওয়ার রিয়েলটাইম লিসেনার
        firebase.database().ref('ui_config').on('value', function(snapshot) {
            const config = snapshot.val();
            if (config) {
                if (config.bg_color) document.body.style.backgroundColor = config.bg_color;
                if (config.app_title) {
                    document.getElementById('appHeader').innerText = "🤖 " + config.app_title;
                    document.getElementById('pageTitle').innerText = config.app_title;
                }
            }
        });

        // ফায়ারবেস থেকে সব ফিচার আলাদাভাবে রিড করা (পুরোনো ফিচার ডিলিট না করে জমা রাখা)
        firebase.database().ref('features').on('value', function(snapshot) {
            const features = snapshot.val();
            const container = document.getElementById('dynamicFeatureArea');
            container.innerHTML = ""; 

            if (features) {
                Object.keys(features).forEach(function(key) {
                    const item = features[key];
                    if (item.html_code) {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'feature-wrapper';
                        wrapper.id = 'feature_' + key;
                        wrapper.innerHTML = item.html_code;
                        container.appendChild(wrapper);
                    }
                    if (item.js_code) {
                        try { eval(item.js_code); } catch(e) { console.log(e); }
                    }
                });
            }
        });

        const SERVER_URL = "https://chitti-robot-qh89.onrender.com/chat";
        let conversationHistory = [];

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Google Chrome ব্যবহার করুন।");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';
            recognition.start();

            document.getElementById('reply').innerText = "শুনছি, বলুন...";

            recognition.onresult = function(event) {
                let text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                sendMsg();
            };
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function sendMsg() {
            let input = document.getElementById('userInput');
            let replyDiv = document.getElementById('reply');
            let msg = input.value.trim();
            if(!msg) return;

            replyDiv.innerText = "চিন্তা করছি...";
            input.value = "";

            try {
                let res = await fetch(SERVER_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        message: msg,
                        history: conversationHistory
                    })
                });

                let data = await res.json();
                replyDiv.innerText = data.reply;
                speakText(data.reply);

                conversationHistory.push({"role": "user", "content": msg});
                conversationHistory.push({"role": "assistant", "content": data.reply});

            } catch (err) {
                replyDiv.innerText = "সার্ভারের সাথে সংযোগ বিচ্ছিন্ন হয়েছে!";
            }
        }
    </script>
</body>
</html>
