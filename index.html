<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chitti AI - 100% Autonomous Income & Project Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #07090e; color: #f1f5f9; text-align: center; padding: 30px; }
        .wrapper { background: #111827; padding: 35px; border-radius: 16px; display: inline-block; max-width: 650px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #1f2937; }
        h1 { color: #0ea5e9; font-size: 26px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; }
        button { background: #6366f1; color: white; border: none; padding: 14px 28px; font-size: 16px; border-radius: 10px; cursor: pointer; margin-top: 20px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #4f46e5; }
        .display-box { background: #030712; padding: 20px; border-radius: 8px; margin-top: 25px; text-align: left; font-family: monospace; font-size: 13px; color: #4ade80; border: 1px solid #1e293b; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>🤖 Chitti AI Autonomous Control Center</h1>
        <p>Zero Human Effort: AI is managing your channel, generating viral tech projects, PCB concepts, and revenue pipelines 24/7.</p>
        
        <button onclick="triggerAutonomousAI()">Trigger AI Project & Income Automation</button>
        
        <div class="display-box" id="aiOutput">System on standby. Click the button to let AI generate the next viral automated project...</div>
    </div>

    <script>
        async function triggerAutonomousAI() {
            document.getElementById('aiOutput').innerText = "AI is scanning trends, designing PCB frameworks, and setting up monetization...";
            try {
                let response = await fetch('/api/ai/autonomous-engine', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ niche: "Advanced ESP32 Wireless Mesh & AI Automation" })
                });
                let data = await response.json();
                document.getElementById('aiOutput').innerText = JSON.stringify(data.package, null, 2);
            } catch (error) {
                document.getElementById('aiOutput').innerText = "Error connecting to AI backend server.";
            }
        }
    </script>
</body>
</html>
