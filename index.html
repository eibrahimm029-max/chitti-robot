<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Gemini Chitti Robot - Live</title>
    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            justify-content: space-between;
        }

        #robot-face-box {
            width: 100%;
            max-width: 350px;
            height: 180px;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            margin-top: 20px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        .eye-container {
            display: flex;
            justify-content: space-around;
            width: 80px;
            margin-bottom: 10px;
        }
        .eye {
            width: 15px;
            height: 25px;
            background: #00ffcc;
            border-radius: 10px;
            animation: blink 4s infinite;
        }
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        #robot-status {
            font-size: 13px;
            color: #00ffcc;
            line-height: 1.4;
            max-height: 70px;
            overflow: hidden;
        }

        .main-panel {
            width: 100%;
            max-width: 350px;
            background: #0d1117;
            border: 1px solid #1f293d;
            padding: 12px;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 12px;
            color: #8b949e;
        }

        #floating-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ffcc;
            color: #000;
            padding: 10px 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- রোবটের ডিসপ্লে ও চোখ -->
    <div id="robot-face-box">
        <div class="eye-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <h3 id="ai-name" style="margin: 0 0 5px 0; color: #fff;">চিঠি রোবট</h3>
        <p id="robot-status">ফায়ারবেস লাইভ ও জেমিনি প্রস্তুত। শুনছি...</p>
    </div>

    <!-- রিয়েল-টাইম মেমোরি ও রুলস প্যানেল -->
    <div class="main-panel">
        <p><strong>ফায়ারওয়াল ও সিকিউরিটি:</strong> <span id="fw-status" style="color: #00ffcc;">মিলিটারি-গ্রেড এনক্রিপ্টেড 🛡️</span></p>
        <p><strong>অটো-সেভড কমান্ড ও রুলস:</strong></p>
        <div id="rules-list" style="color: #00ffcc; max-height: 80px; overflow-y: auto;">কোনো কমান্ড রেকর্ড হয়নি।</div>
    </div>

    <!-- ফ্লোটিং ভয়েস স্ট্যাটাস -->
    <div id="floating-status">🎙️ কান সজাগ রয়েছে</div>

    <!-- ফায়ারবেস ও জেমিনি লজিক স্ক্রিপ্ট -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
          apiKey: "AIzaSyDu3WADHPHQSHPJd1zoa5Z4TGVEP0cl_8g",
          authDomain: "chitti-bfa21.firebaseapp.com",
          databaseURL: "https://chitti-bfa21-default-rtdb.firebaseio.com",
          projectId: "chitti-bfa21",
          storageBucket: "chitti-bfa21.firebasestorage.app",
          messagingSenderId: "192136261108",
          appId: "1:192136261108:web:bf2290d269fa7a3391dda1",
          measurementId: "G-D6JM85X76F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // জেমিনি API Key
        const GEMINI_API_KEY = "AQ.Ab8RN6IEF-dUdQd8i1GSGKK7VEjBLl3FixNZI-951isnS7IlMA";

        let robotMemory = {
            name: "চিঠি রোবট",
            rules: []
        };

        window.onload = function() {
            loadFirebaseMemory();
            startContinuousAutonomousListener();
            speakAndDisplay("সিস্টেম পুরোপুরি লাইভ। বলুন ওনার, কী করতে হবে?");
        };

        function loadFirebaseMemory() {
            const dbRef = ref(db, 'chitti_ai_core/');
            onValue(dbRef, (snapshot) => {
                let data = snapshot.val();
                if (data) {
                    if (data.name) {
                        robotMemory.name = data.name;
                        document.getElementById('ai-name').innerText = data.name;
                    }
                    if (data.rules) {
                        robotMemory.rules = data.rules;
                        updateRulesUI();
                    }
                }
            });
        }

        function startContinuousAutonomousListener() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            const recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                let spokenText = event.results[event.results.length - 1][0].transcript.trim();
                processWithGeminiAI(spokenText);
            };

            recognition.onerror = function() { try { recognition.start(); } catch(e) {} };
            recognition.onend = function() { try { recognition.start(); } catch(e) {} };

            try { recognition.start(); } catch(e) {}
        }

        async function processWithGeminiAI(userInput) {
            speakAndDisplay("বিশ্লেষণ করা হচ্ছে...");

            try {
                let prompt = `তুমি একজন অটোনমাস রোবট যার নাম "${robotMemory.name}"। ইউজার বাংলায় একটি কমান্ড দিয়েছেন: "${userInput}". 
                এই কমান্ড থেকে বের করে আনো যে ইউজার কী করতে চাচ্ছেন (যেমন: নাম পরিবর্তন, নতুন রুলস যোগ করা, ফায়ারওয়াল আপডেট বা অন্য কিছু)। 
                আমাকে শুধু JSON ফরম্যাটে উত্তর দাও নিচের মতো করে:
                {
                  "actionType": "rename/rule/security/other",
                  "extractedValue": "নতুন মান বা রুলস",
                  "replyMessage": "রোবটের মুখে বলার মতো একটি চমৎকার বাংলা উত্তর"
                }`;

                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                let result = await response.json();
                let textResponse = result.candidates[0].content.parts[0].text;
                
                let jsonStart = textResponse.indexOf('{');
                let jsonEnd = textResponse.lastIndexOf('}') + 1;
                let aiData = JSON.parse(textResponse.substring(jsonStart, jsonEnd));

                executeAiCommand(aiData);

            } catch (error) {
                fallbackLocalExecution(userInput);
            }
        }

        function executeAiCommand(data) {
            let reply = data.replyMessage || "নির্দেশ সফলভাবে কার্যকর করা হয়েছে।";

            if (data.actionType === "rename") {
                robotMemory.name = data.extractedValue;
                set(ref(db, 'chitti_ai_core/name'), robotMemory.name);
                document.getElementById('ai-name').innerText = robotMemory.name;
            } else {
                robotMemory.rules.push(data.extractedValue);
                set(ref(db, 'chitti_ai_core/rules'), robotMemory.rules);
                updateRulesUI();
            }

            speakAndDisplay(reply);
        }

        function fallbackLocalExecution(text) {
            robotMemory.rules.push(text);
            set(ref(db, 'chitti_ai_core/rules'), robotMemory.rules);
            updateRulesUI();
            speakAndDisplay("আপনার কমান্ডটি ফায়ারবেসে সেভ করা হয়েছে ওনার।");
        }

        function updateRulesUI() {
            let container = document.getElementById('rules-list');
            if (robotMemory.rules.length > 0) {
                container.innerHTML = robotMemory.rules.map((rule, idx) => `<div>${idx + 1}. ${rule}</div>`).join('');
            } else {
                container.innerHTML = "কোনো কমান্ড রেকর্ড হয়নি।";
            }
        }

        function speakAndDisplay(text) {
            document.getElementById('robot-status').innerText = text;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
