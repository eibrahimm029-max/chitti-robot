<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Gemini Chitti Robot</title>
    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            justify-content: space-between;
        }

        #robot-face-box {
            width: 100%;
            max-width: 350px;
            height: 190px;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
            margin-top: 15px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        .eye-container {
            display: flex;
            justify-content: space-around;
            width: 80px;
            margin-bottom: 12px;
        }
        .eye {
            width: 16px;
            height: 26px;
            background: #00ffcc;
            border-radius: 10px;
            animation: blink 4s infinite;
        }
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        #robot-status {
            font-size: 13px;
            color: #00ffcc;
            line-height: 1.4;
            max-height: 70px;
            overflow: hidden;
        }

        .main-panel {
            width: 100%;
            max-width: 350px;
            background: #0d1117;
            border: 1px solid #1f293d;
            padding: 12px;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 12px;
            color: #8b949e;
        }

        #floating-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ffcc;
            color: #000;
            padding: 10px 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- রোবটের ডিসপ্লে ও চোখ -->
    <div id="robot-face-box">
        <div class="eye-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <h3 id="ai-name" style="margin: 0 0 5px 0; color: #fff;">চিঠি রোবট</h3>
        <p id="robot-status">সিস্টেম প্রস্তুত। বলুন ওনার...</p>
    </div>

    <!-- প্যানেল -->
    <div class="main-panel">
        <p><strong>কথোপকথন মোড:</strong> <span style="color: #00ffcc;">পারমিশন ভিত্তিক আপডেট 🛡️</span></p>
        <p><strong>সেভড মেমোরি ও রুলস:</strong></p>
        <div id="rules-list" style="color: #00ffcc; max-height: 75px; overflow-y: auto;">কোনো ডেটা নেই।</div>
    </div>

    <!-- ফ্লোটিং স্ট্যাটাস -->
    <div id="floating-status">🎙️ প্রস্তুত</div>

    <!-- স্ক্রিপ্ট -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDu3WADHPHQSHPJd1zoa5Z4TGVEP0cl_8g",
          authDomain: "chitti-bfa21.firebaseapp.com",
          databaseURL: "https://chitti-bfa21-default-rtdb.firebaseio.com",
          projectId: "chitti-bfa21",
          storageBucket: "chitti-bfa21.firebasestorage.app",
          messagingSenderId: "192136261108",
          appId: "1:192136261108:web:bf2290d269fa7a3391dda1",
          measurementId: "G-D6JM85X76F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const GEMINI_API_KEY = "AQ.Ab8RN6IEF-dUdQd8i1GSGKK7VEjBLl3FixNZI-951isnS7IlMA";

        let robotMemory = { name: "চিঠি রোবট", rules: [] };
        let recognition = null;
        let isRobotSpeaking = false;
        let pendingAction = null;

        window.onload = function() {
            loadFirebaseMemory();
            initSpeechRecognition();
            speakAndDisplay("হ্যালো ওনার! আমি চিঠি রোবট। বলুন, আপনার সাথে কী নিয়ে আলোচনা করব?");
        };

        function loadFirebaseMemory() {
            const dbRef = ref(db, 'chitti_ai_core/');
            onValue(dbRef, (snapshot) => {
                let data = snapshot.val();
                if (data) {
                    if (data.name) {
                        robotMemory.name = data.name;
                        document.getElementById('ai-name').innerText = data.name;
                    }
                    if (data.rules) {
                        robotMemory.rules = data.rules;
                        updateRulesUI();
                    }
                }
            });
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                document.getElementById('floating-status').innerText = "🎙️ শুনছি...";
            };

            recognition.onresult = function(event) {
                if (isRobotSpeaking) return;
                let spokenText = event.results[0][0].transcript.trim();
                if (spokenText.length > 1) {
                    processWithGeminiAI(spokenText);
                }
            };

            recognition.onerror = function() {
                restartListening();
            };

            recognition.onend = function() {
                if (!isRobotSpeaking) {
                    setTimeout(restartListening, 400);
                }
            };

            restartListening();
        }

        function restartListening() {
            if (isRobotSpeaking) return;
            try {
                recognition.start();
            } catch(e) {}
        }

        async function processWithGeminiAI(userInput) {
            try { recognition.stop(); } catch(e) {}
            speakAndDisplay("ভাবছি...");

            try {
                let prompt = `তুমি একজন বুদ্ধিমান অটোনমাস এআই রোবট যার নাম "${robotMemory.name}"। ইউজারের কথা হলো: "${userInput}". 
                তোমার কাজ হলো ইউজারের সাথে বাংলা ভাষায় স্বাধীনভাবে কথা বলা, যুক্তিতর্ক করা বা আলোচনা করা। 
                যদি ইউজার কোনো কোড, নাম বা ডাটাবেজ আপডেট করার অনুরোধ করে, তবে সরাসরি সেভ কোরো না। সেটির একটি সংক্ষিপ্ত উত্তর বা প্রস্তাব তৈরি করো।
                তুমি নিচের সাধারণ JSON ফরম্যাটে উত্তর দেবে (এর বাইরে কোনো অতিরিক্ত লেখা বা মার্কডাউন কোড ব্লক ব্যবহার করবে না):
                {
                  "replyMessage": "রোবটের মুখে বলার মতো চমৎকার সাবলীল বাংলা উত্তর বা পরামর্শ",
                  "needsPermission": true,
                  "extractedData": "${userInput}"
                }`;

                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                let result = await response.json();
                let textResponse = result.candidates[0].content.parts[0].text;
                
                // ক্লিন কোড ও জেসন এক্সট্রাক্ট করার নিরাপদ পদ্ধতি
                let cleanJsonStr = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                let jsonStart = cleanJsonStr.indexOf('{');
                let jsonEnd = cleanJsonStr.lastIndexOf('}') + 1;
                let aiData = JSON.parse(cleanJsonStr.substring(jsonStart, jsonEnd));

                handleAiLogic(aiData, userInput);

            } catch (error) {
                // জেমিনি থেকে সরাসরি সাধারণ টেক্সট উত্তর নেওয়ার ফলব্যাক পদ্ধতি
                speakAndDisplay(userInput + " এ বিষয়ে আপনার সাথে বিস্তারিত আলোচনা করছি ওনার। বলুন কী করতে হবে?");
            }
        }

        function handleAiLogic(data, rawInput) {
            let reply = data.replyMessage || "বুঝেছি ওনার।";
            let isApproving = rawInput.includes("হ্যাঁ") || rawInput.includes("করো") || rawInput.includes("ঠিক আছে") || rawInput.includes("দাও");

            if (pendingAction && isApproving) {
                executeDatabaseUpdate(pendingAction.extractedData);
                pendingAction = null;
                return;
            }

            if (data.needsPermission) {
                pendingAction = data;
                speakAndDisplay(reply + " এটি কি ফায়ারবেসে লাইভ করে দেব, ওনার?");
            } else {
                speakAndDisplay(reply);
            }
        }

        function executeDatabaseUpdate(dataContent) {
            speakAndDisplay("আপনার অনুমতি পেয়েছি। ফায়ারবেসে লাইভ আপডেট করা হচ্ছে...");
            
            if (dataContent.length < 25 && !dataContent.includes("কোড")) {
                robotMemory.name = dataContent;
                set(ref(db, 'chitti_ai_core/name'), robotMemory.name);
                document.getElementById('ai-name').innerText = robotMemory.name;
            } else {
                robotMemory.rules.push(dataContent);
                set(ref(db, 'chitti_ai_core/rules'), robotMemory.rules);
                updateRulesUI();
            }

            setTimeout(() => {
                speakAndDisplay("সফলভাবে ফায়ারবেসে লাইভ আপডেট করা হয়েছে ওনার!");
            }, 1000);
        }

        function updateRulesUI() {
            let container = document.getElementById('rules-list');
            if (robotMemory.rules.length > 0) {
                container.innerHTML = robotMemory.rules.map((r, i) => `<div>${i + 1}. ${r}</div>`).join('');
            } else {
                container.innerHTML = "কোনো ডেটা নেই।";
            }
        }

        function speakAndDisplay(text) {
            document.getElementById('robot-status').innerText = text;
            document.getElementById('floating-status').innerText = "🤖 রোবট কথা বলছে...";
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                utterance.rate = 1.0;
                
                isRobotSpeaking = true;

                utterance.onend = function() {
                    isRobotSpeaking = false;
                    document.getElementById('floating-status').innerText = "🎙️ শুনছি...";
                    setTimeout(restartListening, 400);
                };

                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
