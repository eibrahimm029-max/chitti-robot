services:
  - type: web
    name: chitti-robot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PIXVERSE_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
